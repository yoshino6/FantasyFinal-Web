<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8ee" />
    <meta name="description" content="FantasyFinal 奇幻冒险 H5 客户端" />
    <title>FantasyFinal · 奇幻冒险</title>
    <link rel="preload" as="image" href="/assets/loading/fantasy-logo.webp" />
    <style>
      #ff-boot { position: fixed; z-index: 9999; inset: 0; overflow: hidden; display: grid; place-items: center; color: #514366; background: #eaf6ee; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; transition: opacity .24s ease; }
      #ff-boot::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(225, 243, 255, .08), rgba(255, 248, 230, .3) 65%, rgba(255, 248, 230, .68)), url('/assets/loading/forest.webp') center / cover no-repeat; }
      #ff-boot::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 68%, rgba(255, 255, 255, .55), transparent 49%); pointer-events: none; }
      html[data-ff-boot-warm="1"] #ff-boot, #ff-boot.is-hidden { display: none; }
      #ff-boot.is-exiting { opacity: 0; pointer-events: none; }
      .ff-boot-inner { position: relative; z-index: 1; width: min(480px, calc(100vw - 36px)); margin-top: min(28vh, 180px); text-align: center; }
      .ff-boot-logo { display: block; width: min(350px, 82vw); max-height: 190px; margin: 0 auto 132px; object-fit: contain; filter: drop-shadow(0 5px 3px #fff) drop-shadow(0 10px 18px rgba(68, 78, 81, .23)); }
      .ff-boot-track-wrap { position: relative; }
      .ff-boot-chase { position: absolute; z-index: 2; bottom: calc(100% + 4px); left: 0; width: 205px; height: 105px; transition: left .23s ease-out; pointer-events: none; }
      .ff-boot-pear, .ff-boot-rabbit { position: absolute; display: block; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 4px 3px rgba(80, 77, 70, .22)); }
      .ff-boot-pear { left: 0; bottom: 0; width: 138px; height: 104px; animation: ff-pear-run .55s ease-in-out infinite alternate; }
      .ff-boot-rabbit { right: 0; bottom: 8px; width: 78px; height: 80px; animation: ff-rabbit-hop .43s ease-in-out infinite alternate; }
      #ff-boot-track { overflow: hidden; height: 18px; border: 3px solid rgba(255, 255, 255, .95); border-radius: 99px; background: rgba(255, 255, 255, .73); box-shadow: 0 4px 18px rgba(55, 96, 78, .22), inset 0 1px 5px rgba(100, 104, 106, .12); }
      #ff-boot-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #80c8ab, #b6df9e 42%, #f7c279 78%, #f4a9a2); transition: width .18s ease-out; }
      #ff-boot-status { min-height: 1.6em; margin: 11px 0 0; color: #4e5d5c; font-size: 13px; font-weight: 700; text-shadow: 0 1px 3px #fff; }
      #ff-boot-retry { margin-top: 12px; padding: 8px 20px; border: 1px solid rgba(112, 101, 126, .22); border-radius: 999px; background: rgba(255, 255, 255, .94); color: #65527b; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
      #ff-boot-retry[hidden] { display: none; }
      @keyframes ff-pear-run { from { transform: translate(-2px, 1px) rotate(-3deg); } to { transform: translate(3px, -6px) rotate(2deg); } }
      @keyframes ff-rabbit-hop { from { transform: translate(-3px, 0) rotate(-4deg); } to { transform: translate(4px, -10px) rotate(4deg); } }
      @media (max-width: 480px) { .ff-boot-inner { margin-top: min(23vh, 140px); } .ff-boot-logo { margin-bottom: 120px; } }
      @media (prefers-reduced-motion: reduce) { #ff-boot, .ff-boot-chase, #ff-boot-fill { transition: none; } .ff-boot-pear, .ff-boot-rabbit { animation: none; } }
    </style>
  </head>
  <body>
    <script>try { document.documentElement.dataset.ffBootWarm = localStorage.getItem('fantasy-final.boot-assets.v1') === 'v1:__FF_BOOT_ASSET_REVISION__' ? '1' : '0'; } catch { document.documentElement.dataset.ffBootWarm = '0'; }</script>
    <div id="ff-boot" role="status" aria-live="polite" aria-label="正在加载幻想次元">
      <div class="ff-boot-inner">
        <img class="ff-boot-logo" src="/assets/loading/fantasy-logo.webp" alt="幻想次元" />
        <div class="ff-boot-track-wrap">
          <div id="ff-boot-chase" class="ff-boot-chase" aria-hidden="true"><img class="ff-boot-pear" src="/assets/loading/pear.png" alt="" /><img class="ff-boot-rabbit" src="/assets/loading/ball-rabbit.png" alt="" /></div>
          <div id="ff-boot-track" role="progressbar" aria-label="游戏资源加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="ff-boot-fill"></div></div>
        </div>
        <p id="ff-boot-status">正在准备冒险资源…</p>
        <button id="ff-boot-retry" type="button" hidden>重新加载</button>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
